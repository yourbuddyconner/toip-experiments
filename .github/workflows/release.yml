name: Release

# On every push to main, Changesets either opens (or updates) the "Version Packages" pull request,
# or, once that pull request is merged, publishes the libraries in packages/ to npm.
#
# Publishing uses npm trusted publishing (OIDC), with provenance. If the NPM_TOKEN secret is set,
# npm falls back to it. Only the publish job can request an OIDC token. See RELEASING.md.
#
# The release jobs use Node 24 because trusted publishing needs npm 11.5.1 or later, which Node 24 bundles.
# The built packages are the same on Node 22.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Choose version, publish or nothing
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version changes
      pull-requests: write # open the Version Packages pull request
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Open or update the Version Packages pull request
        uses: changesets/action/version@v2
        with:
          script: npm run version-packages

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Build and check the libraries
        run: npm run release:check

      - name: Pack
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push git tags and create GitHub releases
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish to npm
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # Every publish from CI carries a provenance attestation. (It is not in publishConfig,
          # because provenance only works in CI, and the first release is published from a laptop.)
          NPM_CONFIG_PROVENANCE: "true"
          # Empty unless the secret exists. npm tries trusted publishing first either way.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
