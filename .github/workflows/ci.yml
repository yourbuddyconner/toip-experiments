name: CI

# Type-checks and tests every workspace, then builds and packs the libraries.
# Tests that need nargo, KERIpy, OPA, Playwright's Chromium or a live model skip themselves when the tool is missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # From src/, with no dist/: the workspaces resolve each other through the @toip-tools/source condition.
      - name: Test
        run: npm test

      - name: Build the libraries
        run: npm run build

      - name: Check the tarballs
        run: node scripts/release-check.mjs

      - name: Licenses
        run: npm run licenses
